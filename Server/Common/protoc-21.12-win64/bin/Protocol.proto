syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";


message C_LOGIN
{

}

message S_LOGIN
{
	bool success = 1;
	repeated PlayerInfo players = 2;
}

message C_ENTER_GAME
{
	uint64 playerIndex = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	PlayerInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{
	
}

message S_SPAWN
{
	repeated PlayerInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PlayerInfo info = 1;
}

message S_MOVE
{
	PlayerInfo info = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}

message S_PLAYER_STATS
{
    uint64 object_id = 1;
    int32 kill_count = 2;
    int32 death_count = 3;
    int32 monster_kill_count = 4;
}

message GameResultInfo
{
    uint64 object_id = 1;
    int32 kill_count = 2;
    int32 death_count = 3;
    int32 monster_kill_count = 4;
    int32 score = 5;
    bool is_winner = 6;
}

message S_GAME_RESULT
{
    repeated GameResultInfo results = 1;
}

message C_ATTACK_PLAYER
{
    uint64 targetPlayerId = 1;
    uint32 skillId = 2;
}

message S_DAMAGE_PLAYER
{
    uint64 object_id = 1;
    int32 damage = 2;
}

message S_PLAYER_DEAD
{
    uint64 object_id = 1;
}

message Vector3
{
	float x = 1;
	float y = 2;
	float z = 3;
}

message MobInfo
{
	uint64 mobId = 1;
	uint32 templateId = 2;

	Vector3 pos = 3;
	Vector3 dir = 4;

	int32 hp = 5;
}

message S_SPAWN_MOB
{
	repeated MobInfo mobs = 1;
}

message S_DESPAWN_MOB
{
	repeated uint64 mobIds = 1;
}

message S_MOVE_MOB
{
	MobInfo mob = 1;
}

message C_MOVE_MOB
{
	uint64 mobId = 1;
	Vector3 pos = 2;
	Vector3 dir = 3;
}

message C_ATTACK_MOB
{
	uint64 mobId = 1;
}

message C_USE_SKILL
{
    uint64 playerId = 1;
    uint32 skillId = 2;

    int32 clientShotId = 3;
    Vector3 dir = 4;
    uint64 targetId = 5;
    float chargeScale = 6;
}

message S_USE_SKILL
{
    uint64 playerId = 1;
    uint32 skillId = 2;
    uint64 targetId = 3;
    float chargeScale = 4;
}

message S_DAMAGE_MOB
{
	uint64 mobId = 1;
	int32 damage = 2;
	int32 hp = 3;
}

message C_MONSTER_KILL
{
    uint64 player_id = 1;
}

message S_PROJECTILE_HIT
{
    int32 projectileId = 1;
    uint64 targetId = 2;
    Vector3 hitPos = 3;
    int32 damage = 4;
}

message S_PROJECTILE_DESTROY
{
    int32 projectileId = 1;
}

message S_CHANGE_LEVEL
{
    string level_name = 1;
}

message C_DEMO_NEXT_LEVEL
{
	uint32 targetLevel = 1;
	//1 = PVE / Hunting / LandscapeMap
	//2 = PVP / Battle / NewMap
}

message C_LEVEL_READY
{

}

message C_START_SKILL_CHARGE
{
  uint32 skillid = 1;
}

message S_START_SKILL_CHARGE
{
  uint64 playerid = 1;
  uint32 skillid = 2;
}